<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wandfreigabe — AWO Psychiatriezentrum Halle · Haus 2</title>
<script src="supabase.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --header-bg:#2C353D;
    --header-ink:#F2F4F5;
    --header-ink-dim:#A9B2B9;
    --bg:#F0F2F3;
    --bg-panel:#FFFFFF;
    --line:#E1E1E1;
    --line-dim:#DADEE1;
    --ink:#232728;
    --ink-dim:#6B7680;
    --offen:#C1443B;
    --teilweise:#C98A12;
    --frei:#2E8B4F;
    --accent:#0BA1E2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Open Sans',Helvetica,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--header-bg);flex-wrap:wrap;gap:8px;}
  .title{font-size:15px;font-weight:700;letter-spacing:.2px;color:var(--header-ink);}
  .subtitle{font-size:11px;color:var(--header-ink-dim);margin-top:2px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{background:transparent;border:1px solid #47525B;color:var(--header-ink-dim);border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'Open Sans',Helvetica,Arial,sans-serif;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .rolebar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--bg-panel);border-bottom:1px solid var(--line-dim);flex-wrap:wrap;}
  .rolebar label{font-size:12px;color:var(--ink-dim);}
  select,input,button{font-family:'Open Sans',Helvetica,Arial,sans-serif;}
  select,input[type=text]{background:#fff;color:var(--ink);border:1px solid var(--line-dim);border-radius:6px;padding:6px 10px;font-size:12px;}
  .ghost-btn{background:#fff;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}
  .ghost-btn:hover{background:rgba(11,161,226,.08);}
  .spacer{flex:1;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .conn-live{background:var(--frei);}
  .conn-off{background:var(--offen);}

  main{flex:1;display:flex;overflow:hidden;}
  .plan-area{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .plan-toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg-panel);border-bottom:1px solid var(--line-dim);}
  .zoom-controls{display:flex;gap:4px;margin-left:auto;}
  .zoom-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line-dim);background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px;}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--ink-dim);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block;}

  .viewport{flex:1;position:relative;overflow:hidden;background:
      linear-gradient(var(--bg) 0 0),
      repeating-linear-gradient(0deg, transparent 0 19px, rgba(0,0,0,.035) 19px 20px),
      repeating-linear-gradient(90deg, transparent 0 19px, rgba(0,0,0,.035) 19px 20px);
    cursor:grab;
  }
  .viewport.dragging{cursor:grabbing;}
  .canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
  .canvas img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .canvas svg{position:absolute;top:0;left:0;}
  .wall-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke;}
  .wall-line{fill:none;stroke-linecap:round;pointer-events:none;transition:stroke 0.15s ease, stroke-width 0.15s ease;}
  .wall-line.offen{stroke:var(--offen);stroke-width:5;}
  .wall-line.teilweise{stroke:var(--teilweise);stroke-width:5.5;}
  .wall-line.frei{stroke:var(--frei);stroke-width:5;}
  .wall-line.selected{stroke:var(--accent) !important;stroke-width:7 !important;}

  .marker-label-input{width:100%;font-size:14px;font-weight:700;background:transparent;border:none;border-bottom:1px solid var(--line-dim);color:var(--ink);padding:4px 0 6px;margin-bottom:2px;font-family:'Open Sans',Helvetica,Arial,sans-serif;}
  .marker-label-input:focus{outline:none;border-bottom-color:var(--accent);}

  .company-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-panel);border:1px solid var(--accent);border-radius:8px;padding:12px;width:260px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .company-row{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;font-size:12.5px;border-bottom:1px solid var(--line-dim);}
  .company-row:last-of-type{border-bottom:none;}
  .company-row .remove-btn{background:none;border:none;color:var(--offen);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
  .company-row .remove-btn:disabled{opacity:.3;cursor:not-allowed;}
  .company-add-row{display:flex;gap:6px;margin-top:10px;}
  .company-add-row input{flex:1;min-width:0;}
  .company-add-row button{border:none;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;background:var(--accent);color:var(--bg-panel);font-weight:700;white-space:nowrap;}
  .company-panel-title{font-size:11px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}

  aside{width:300px;border-left:1px solid var(--line-dim);background:var(--bg-panel);padding:18px;overflow-y:auto;flex-shrink:0;}
  .empty-panel{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:40px;text-align:center;}
  .empty-text{font-size:12px;color:var(--ink-dim);line-height:1.5;}
  .panel-header{font-size:14px;font-weight:700;}
  .panel-sub{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .trade-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line-dim);border-radius:8px;padding:8px 10px;margin-top:8px;}
  .trade-name{font-size:12.5px;font-weight:600;}
  .trade-meta{font-size:10.5px;color:var(--ink-dim);margin-top:1px;}
  .small-btn{border:none;border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;white-space:nowrap;}
  .small-btn.go{background:var(--frei);color:#fff;font-weight:700;}
  .small-btn.undo{background:transparent;color:var(--ink-dim);border:1px solid var(--line-dim);}
  .small-btn:disabled{cursor:not-allowed;opacity:.45;}
  .hint{font-size:11px;color:var(--ink-dim);margin-top:16px;line-height:1.5;}

  .protocol-area{flex:1;padding:20px;overflow-y:auto;}
  .log-row{display:flex;flex-direction:column;gap:2px;font-size:12.5px;padding:8px 10px;background:var(--bg-panel);border-bottom:1px solid var(--line-dim);}
  .log-ts{color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:50;}

  ::selection{background:rgba(11,161,226,.35);}
  @media (max-width:760px){
    aside{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.4);}
  }
</style>
</head>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:16px;">
      <img src="innotech-logo.png" alt="INNOTECH Leipzig GmbH" style="height:26px;width:auto;display:block;" />
      <div style="width:1px;height:28px;background:var(--line-dim);"></div>
      <div>
        <div class="title">Wandfreigabe — AWO Psychiatriezentrum Halle, Haus 2</div>
        <div class="subtitle"><span id="connDot" class="status-dot conn-off"></span><span id="connText">verbinde…</span> · Umbau und Sanierung — Lph 8</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="eg">Erdgeschoss</button>
      <button class="tab-btn" data-tab="og">Obergeschoss</button>
      <button class="tab-btn" data-tab="protokoll">Protokoll</button>
    </div>
  </header>

  <div class="rolebar">
    <label>Firma:</label>
    <select id="roleSelect"></select>
    <div style="position:relative;display:inline-block;">
      <button class="ghost-btn" id="manageCompaniesBtn">Firmen verwalten</button>
      <div id="companyPanel" class="company-panel" style="display:none;"></div>
    </div>
    <input type="text" id="nameInput" placeholder="Name / Kürzel (optional)" style="width:170px" />
    <div class="spacer"></div>
    <button class="ghost-btn" id="exportBtn">Protokoll kopieren</button>
    <button class="ghost-btn" id="exportPdfBtn">Als PDF exportieren</button>
  </div>

  <main>
    <div class="plan-area" id="planArea">
      <div class="plan-toolbar">
        <div class="legend">
          <span><i style="background:var(--offen)"></i>Offen</span>
          <span><i style="background:var(--teilweise)"></i>Teilweise</span>
          <span><i style="background:var(--frei)"></i>Komplett freigegeben</span>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut">–</button>
          <button class="zoom-btn" id="zoomReset" style="width:auto;padding:0 8px;font-size:11px;">100%</button>
          <button class="zoom-btn" id="zoomIn">+</button>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
          <img id="planImg" draggable="false" />
          <svg id="wallSvg"></svg>
        </div>
      </div>
    </div>

    <aside id="sidePanel">
      <div class="empty-panel">
        <div class="empty-text">Wand im Plan anklicken, um Freigaben pro Firma zu setzen.<br/><br/>Alle Trockenbauwände wurden automatisch aus dem CAD-Plan (Layer „AK-LEICHTBAU") übernommen.</div>
      </div>
    </aside>
  </main>

  <div id="protocolArea" class="protocol-area" style="display:none;"></div>
</div>

<div id="toastHost"></div>

let supa = null;
try {
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  console.error("Supabase-Bibliothek konnte nicht initialisiert werden:", e);
}

// ---------- State ----------
let state = {
  currentFloor: "eg",
  currentTab: "eg",
  data: { eg: { status: {}, log: [] }, og: { status: {}, log: [] } },
  role: COMPANIES[0].key,
  name: "",
  selectedWallId: null,
  scale: 1, tx: 0, ty: 0,
  fitScale: 1,
};

function emptyFloorData() { return { status: {}, log: [] }; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function emptyCompanies() {
  const c = {};
  COMPANIES.forEach((co) => { c[co.key] = { done: false, by: null, at: null }; });
  return c;
}

function getWallStatusEntry(floorId, wallId) {
  const floorData = state.data[floorId];
  if (!floorData.status[wallId]) floorData.status[wallId] = { companies: emptyCompanies() };
  const entry = floorData.status[wallId];
  COMPANIES.forEach((c) => { if (!entry.companies[c.key]) entry.companies[c.key] = { done: false, by: null, at: null }; });
  return entry;
}

// ---------- Firmenverwaltung ----------
function slugifyKey(name, existingKeys) {
  let base = name.trim().toUpperCase()
    .replace(/[ÄÖÜ]/g, (m) => ({ "Ä": "AE", "Ö": "OE", "Ü": "UE" }[m]))
    .replace(/[^A-Z0-9 &]/g, "")
    .split(/\s+/).filter(Boolean).map((w) => w[0]).join("")
    .slice(0, 6);
  if (!base) base = "FIRMA";
  let key = base, n = 1;
  while (existingKeys.includes(key)) { n++; key = base + n; }
  return key;
}

async function loadCompanies() {
  if (!supa) return;
  try {
    const { data, error } = await supa.from(TABLE).select("data").eq("id", "companies").maybeSingle();
    if (error) throw error;
    if (data && data.data && Array.isArray(data.data.list) && data.data.list.length) {
      COMPANIES = data.data.list;
    } else {
      await saveCompanies();
    }
  } catch (e) {
    console.error(e);
  }
}

async function saveCompanies() {
  if (!supa) { showToast("Keine Verbindung — Änderung nicht gespeichert."); return; }
  try {
    const { error } = await supa.from(TABLE).upsert({ id: "companies", data: { list: COMPANIES }, updated_at: new Date().toISOString() });
    if (error) throw error;
  } catch (e) {
    console.error(e);
    showToast("Firmenliste konnte nicht gespeichert werden.");
  }
}

function addCompany(name) {
  name = name.trim();
  if (!name) return;
  if (COMPANIES.some((c) => c.name.toLowerCase() === name.toLowerCase())) {
    showToast("Diese Firma gibt es schon.");
    return;
  }
  const key = slugifyKey(name, COMPANIES.map((c) => c.key));
  COMPANIES.push({ key, name });
  saveCompanies();
  onCompaniesChanged();
  showToast(`„${name}" hinzugefügt.`);
}

function removeCompany(key) {
  if (COMPANIES.length <= 1) { showToast("Mindestens eine Firma muss bestehen bleiben."); return; }
  const removed = COMPANIES.find((c) => c.key === key);
  COMPANIES = COMPANIES.filter((c) => c.key !== key);
  if (state.role === key) state.role = COMPANIES[0].key;
  saveCompanies();
  onCompaniesChanged();
  if (removed) showToast(`„${removed.name}" entfernt.`);
}

function onCompaniesChanged() {
  initRoleSelect();
  renderCompanyPanel();
  renderWalls();
  renderSidePanel();
}

function renderCompanyPanel() {
  const panel = document.getElementById("companyPanel");
  const rows = COMPANIES.map((c) => `
    <div class="company-row">
      <span>${esc(c.name)}</span>
      <button class="remove-btn" data-key="${c.key}" ${COMPANIES.length <= 1 ? "disabled" : ""} title="Entfernen">×</button>
    </div>`).join("");
  panel.innerHTML = `
    <div class="company-panel-title">Firmen</div>
    ${rows}
    <div class="company-add-row">
      <input type="text" id="newCompanyInput" placeholder="Neue Firma…" />
      <button id="addCompanyBtn">+ Hinzufügen</button>
    </div>
  `;
  panel.querySelectorAll(".remove-btn").forEach((btn) => {
    btn.addEventListener("click", () => removeCompany(btn.getAttribute("data-key")));
  });
  const input = document.getElementById("newCompanyInput");
  const doAdd = () => { addCompany(input.value); input.value = ""; input.focus(); };
  document.getElementById("addCompanyBtn").addEventListener("click", doAdd);
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") doAdd(); });
}

function toggleCompanyPanel(forceOpen) {
  const panel = document.getElementById("companyPanel");
  const open = forceOpen !== undefined ? forceOpen : panel.style.display === "none";
  if (open) { renderCompanyPanel(); panel.style.display = "block"; }
  else { panel.style.display = "none"; }
}

// ---------- Supabase sync ----------
async function loadFloor(floorId) {
  if (!supa) { state.data[floorId] = emptyFloorData(); return; }
  try {
    const { data, error } = await supa.from(TABLE).select("data").eq("id", floorId).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const d = data.data;
      state.data[floorId] = { status: d.status || {}, log: d.log || [] };
    } else {
      state.data[floorId] = emptyFloorData();
      await saveFloor(floorId);
    }
  } catch (e) {
    console.error(e);
    setConn(false);
  }
}

async function saveFloor(floorId) {
  if (!supa) { showToast("Keine Verbindung — Änderung nicht gespeichert."); return; }
  try {
    const { error } = await supa.from(TABLE).upsert({ id: floorId, data: state.data[floorId], updated_at: new Date().toISOString() });
    if (error) throw error;
  } catch (e) {
    console.error(e);
    showToast("Speichern fehlgeschlagen — Verbindung prüfen.");
  }
}

function setConn(ok) {
  document.getElementById("connDot").className = "status-dot " + (ok ? "conn-live" : "conn-off");
  document.getElementById("connText").textContent = ok ? "live verbunden" : "keine Verbindung";
}

function subscribeRealtime() {
  if (!supa) { setConn(false); return; }
  supa.channel("wandfreigabe-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, (payload) => {
      const row = payload.new;
      if (!row || !row.id) return;
      if (row.id === "companies") {
        const list = row.data && Array.isArray(row.data.list) ? row.data.list : null;
        if (list && list.length) { COMPANIES = list; onCompaniesChanged(); }
        return;
      }
      if (!FLOORS[row.id]) return;
      const d = row.data || {};
      state.data[row.id] = { status: d.status || {}, log: d.log || [] };
      if (state.currentTab === row.id) { renderWalls(); renderSidePanel(); }
      if (state.currentTab === "protokoll") renderProtocol();
    })
    .subscribe((status) => setConn(status === "SUBSCRIBED"));
}

// ---------- Helpers ----------
function statusOf(entry) {
  const total = COMPANIES.length;
  const done = COMPANIES.filter((c) => entry.companies[c.key]?.done).length;
  if (done === 0) return "offen";
  if (done === total) return "frei";
  return "teilweise";
}
function canToggle(companyKey) { return state.role === companyKey; }
function fmtDate(iso) { return new Date(iso).toLocaleString("de-DE"); }
function showToast(msg) {
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  host.innerHTML = "";
  host.appendChild(el);
  setTimeout(() => { el.remove(); }, 2400);
}

function initRoleSelect() {
  const sel = document.getElementById("roleSelect");
  sel.innerHTML = COMPANIES.map((c) => `<option value="${c.key}">${c.name}</option>`).join("");
  sel.value = state.role;
  sel.addEventListener("change", () => { state.role = sel.value; renderSidePanel(); });
  document.getElementById("nameInput").addEventListener("input", (e) => { state.name = e.target.value; });
}

// ---------- Plan image / viewport ----------
function initPlanImage() {
  const img = document.getElementById("planImg");
  const floor = FLOORS[state.currentFloor];
  img.src = floor.img;
  img.onload = () => { fitToViewport(); renderWalls(); };
}

function fitToViewport() {
  const viewport = document.getElementById("viewport");
  const floor = FLOORS[state.currentFloor];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const scale = Math.min(vw / floor.w, vh / floor.h) * 0.96;
  state.fitScale = scale;
  state.scale = scale;
  state.tx = (vw - floor.w * scale) / 2;
  state.ty = 20;
  applyTransform();
  updateZoomLabel();
}

function applyTransform() {
  const canvas = document.getElementById("canvas");
  const img = document.getElementById("planImg");
  const svg = document.getElementById("wallSvg");
  const floor = FLOORS[state.currentFloor];
  img.style.width = floor.w + "px";
  img.style.height = floor.h + "px";
  svg.setAttribute("width", floor.w);
  svg.setAttribute("height", floor.h);
  svg.setAttribute("viewBox", `0 0 ${floor.w} ${floor.h}`);
  canvas.style.width = floor.w + "px";
  canvas.style.height = floor.h + "px";
  canvas.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
}

function updateZoomLabel() {
  document.getElementById("zoomReset").textContent = Math.round((state.scale / state.fitScale) * 100) + "%";
}
function clampScale(s) { return Math.max(state.fitScale * 0.5, Math.min(state.fitScale * 10, s)); }

function initViewportInteractions() {
  const viewport = document.getElementById("viewport");
  let dragging = false, dragStart = null, moved = false;

  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = clampScale(state.scale * factor);
    state.tx = mx - (mx - state.tx) * (newScale / state.scale);
    state.ty = my - (my - state.ty) * (newScale / state.scale);
    state.scale = newScale;
    applyTransform();
    updateZoomLabel();
  }, { passive: false });

  viewport.addEventListener("mousedown", (e) => {
    if (e.target.closest(".wall-hit")) return;
    dragging = true; moved = false;
    dragStart = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    viewport.classList.add("dragging");
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    state.tx = dragStart.tx + dx;
    state.ty = dragStart.ty + dy;
    applyTransform();
  });
  window.addEventListener("mouseup", () => {
    dragging = false;
    viewport.classList.remove("dragging");
  });

  document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.3));
  document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.3));
  document.getElementById("zoomReset").addEventListener("click", fitToViewport);

  function zoomBy(factor) {
    const rect = viewport.getBoundingClientRect();
    const mx = rect.width / 2, my = rect.height / 2;
    const newScale = clampScale(state.scale * factor);
    state.tx = mx - (mx - state.tx) * (newScale / state.scale);
    state.ty = my - (my - state.ty) * (newScale / state.scale);
    state.scale = newScale; applyTransform(); updateZoomLabel();
  }
}

// ---------- Wall rendering ----------
function renderWalls() {
  const svg = document.getElementById("wallSvg");
  const floorId = state.currentFloor;
  const walls = WALL_GEOMETRY[floorId] || [];
  const floorData = state.data[floorId];

  svg.innerHTML = "";
  walls.forEach((wall) => {
    const floor = FLOORS[floorId];
    const points = wall.pts.map(([x, y]) => `${x * floor.w},${y * floor.h}`).join(" ");
    const entry = getWallStatusEntry(floorId, wall.id);
    const st = statusOf(entry);
    const isSelected = state.selectedWallId === wall.id;

    const hit = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    hit.setAttribute("points", points);
    hit.setAttribute("class", "wall-hit");
    hit.addEventListener("click", () => selectWall(wall.id));

    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", points);
    line.setAttribute("class", "wall-line " + st + (isSelected ? " selected" : ""));

    svg.appendChild(hit);
    svg.appendChild(line);
  });
}

function selectWall(wallId) {
  state.selectedWallId = wallId;
  renderWalls();
  renderSidePanel();
}

// ---------- Side panel ----------
function renderSidePanel() {
  const panel = document.getElementById("sidePanel");
  const floorId = state.currentFloor;
  const wallId = state.selectedWallId;
  if (!wallId) {
    panel.innerHTML = `<div class="empty-panel"><div class="empty-text">Wand im Plan anklicken, um Freigaben pro Firma zu setzen.<br/><br/>Alle Trockenbauwände wurden automatisch aus dem CAD-Plan (Layer „AK-LEICHTBAU") übernommen.</div></div>`;
    return;
  }
  const entry = getWallStatusEntry(floorId, wallId);
  const st = statusOf(entry);
  const stColorVar = st === "offen" ? "var(--offen)" : st === "teilweise" ? "var(--teilweise)" : "var(--frei)";
  const label = entry.label || `Wand ${wallId.replace("w", "")}`;

  let rows = "";
  COMPANIES.forEach((c) => {
    const ce = entry.companies[c.key];
    const allowed = canToggle(c.key);
    rows += `
      <div class="trade-row" style="opacity:${allowed ? 1 : 0.55}">
        <div>
          <div class="trade-name">${c.name}</div>
          ${ce.done ? `<div class="trade-meta">${ce.by} · ${fmtDate(ce.at)}</div>` : `<div class="trade-meta">offen</div>`}
        </div>
        <button class="small-btn ${ce.done ? "undo" : "go"}" data-company="${c.key}" ${allowed ? "" : "disabled"}>
          ${ce.done ? "Zurückziehen" : "Freigeben"}
        </button>
      </div>`;
  });

  panel.innerHTML = `
    <input type="text" class="marker-label-input" id="wallLabelInput" value="${esc(label)}" placeholder="Bezeichnung (optional)" />
    <div class="panel-sub">Status: <strong style="color:${stColorVar}">${st.toUpperCase()}</strong> · ${FLOORS[floorId].label}</div>
    ${rows}
    <p class="hint">Als „${COMPANIES.find((c) => c.key === state.role)?.name}" kannst du nur die eigene Freigabe setzen.</p>
  `;
  panel.querySelectorAll("button[data-company]").forEach((btn) => {
    btn.addEventListener("click", () => toggleCompany(wallId, btn.getAttribute("data-company")));
  });
  const labelInput = document.getElementById("wallLabelInput");
  labelInput.addEventListener("change", () => renameWall(wallId, labelInput.value));
  labelInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") labelInput.blur(); });
}

function renameWall(wallId, newLabel) {
  const floorId = state.currentFloor;
  const entry = getWallStatusEntry(floorId, wallId);
  entry.label = newLabel.trim() || null;
  saveFloor(floorId);
}

function toggleCompany(wallId, companyKey) {
  if (!canToggle(companyKey)) return;
  const floorId = state.currentFloor;
  const entry = getWallStatusEntry(floorId, wallId);
  const ce = entry.companies[companyKey];
  const ts = new Date().toISOString();
  const actor = state.name ? `${state.role} (${state.name})` : state.role;
  const companyName = COMPANIES.find((c) => c.key === companyKey).name;
  const label = entry.label || `Wand ${wallId.replace("w", "")}`;

  if (ce.done) {
    ce.done = false; ce.by = null; ce.at = null;
    state.data[floorId].log.unshift({ ts, wallId, label, floor: floorId, company: companyName, action: "zurückgezogen", by: actor });
  } else {
    ce.done = true; ce.by = actor; ce.at = ts;
    state.data[floorId].log.unshift({ ts, wallId, label, floor: floorId, company: companyName, action: "freigegeben", by: actor });
  }
  state.data[floorId].log = state.data[floorId].log.slice(0, 500);
  saveFloor(floorId);
  renderWalls();
  renderSidePanel();
}

// ---------- Protocol ----------
function renderProtocol() {
  const area = document.getElementById("protocolArea");
  const allLogs = [...state.data.eg.log, ...state.data.og.log].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  if (allLogs.length === 0) {
    area.innerHTML = `<div class="panel-header">Verlauf</div><p class="empty-text" style="margin-top:10px;">Noch keine Einträge — sobald eine Firma eine Wand freigibt, erscheint das hier.</p>`;
    return;
  }
  const rows = allLogs.map((l) => `
    <div class="log-row">
      <span class="log-ts">${fmtDate(l.ts)} · ${FLOORS[l.floor]?.label || l.floor}</span>
      <span><strong>${esc(l.label)}</strong> — ${l.company}
        <span style="color:${l.action === "freigegeben" ? "var(--frei)" : "var(--offen)"}">${l.action}</span>
        durch ${l.by}</span>
    </div>`).join("");
  area.innerHTML = `<div class="panel-header">Verlauf</div><div style="margin-top:10px;">${rows}</div>`;
}

function exportProtocol() {
  const lines = ["PROTOKOLL — WANDFREIGABEN", "AWO Psychiatriezentrum Halle, Haus 2", new Date().toLocaleString("de-DE"), ""];
  Object.keys(FLOORS).forEach((floorId) => {
    lines.push(`=== ${FLOORS[floorId].label} ===`);
    const walls = WALL_GEOMETRY[floorId] || [];
    walls.forEach((wall) => {
      const entry = getWallStatusEntry(floorId, wall.id);
      const st = statusOf(entry);
      const label = entry.label || `Wand ${wall.id.replace("w", "")}`;
      lines.push(`${label} [${st.toUpperCase()}]`);
      COMPANIES.forEach((c) => {
        const ce = entry.companies[c.key];
        lines.push(`  - ${c.name}: ${ce.done ? `freigegeben (${ce.by}, ${fmtDate(ce.at)})` : "offen"}`);
      });
    });
    lines.push("");
  });
  lines.push("VERLAUF:");
  const allLogs = [...state.data.eg.log, ...state.data.og.log].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  allLogs.forEach((l) => lines.push(`${fmtDate(l.ts)} — ${FLOORS[l.floor]?.label} — ${l.label}: ${l.company} ${l.action} durch ${l.by}`));

  const text = lines.join("\n");
  navigator.clipboard.writeText(text).then(
    () => showToast("Protokoll in Zwischenablage kopiert."),
    () => showToast("Kopieren nicht möglich.")
  );
}

// ---------- Tabs ----------
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const planArea = document.getElementById("planArea");
  const sidePanel = document.getElementById("sidePanel");
  const protocolArea = document.getElementById("protocolArea");
  if (tab === "protokoll") {
    planArea.style.display = "none";
    sidePanel.style.display = "none";
    protocolArea.style.display = "block";
    renderProtocol();
  } else {
    planArea.style.display = "flex";
    sidePanel.style.display = "block";
    protocolArea.style.display = "none";
    state.currentFloor = tab;
    state.selectedWallId = null;
    initPlanImage();
    renderSidePanel();
  }
}

// ---------- PDF-Export ----------
function renderFloorCanvas(floorId) {
  return new Promise((resolve) => {
    const floor = FLOORS[floorId];
    const targetW = 2200;
    const scale = targetW / floor.w;
    const canvas = document.createElement("canvas");
    canvas.width = targetW;
    canvas.height = Math.round(floor.h * scale);
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const walls = WALL_GEOMETRY[floorId] || [];
      const colors = { offen: "#C1443B", teilweise: "#E0A526", frei: "#3E9B5C" };
      walls.forEach((wall) => {
        const entry = getWallStatusEntry(floorId, wall.id);
        const st = statusOf(entry);
        ctx.strokeStyle = colors[st];
        ctx.lineWidth = st === "teilweise" ? 5 : 4;
        ctx.lineCap = "round";
        ctx.beginPath();
        wall.pts.forEach(([x, y], i) => {
          const px = x * canvas.width, py = y * canvas.height;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.stroke();
      });
      resolve(canvas);
    };
    img.src = floor.img;
  });
}

async function exportPdf() {
  if (!window.jspdf) { showToast("PDF-Bibliothek konnte nicht geladen werden."); return; }
  showToast("PDF wird erstellt …");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a3" });
  const margin = 12;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();

  doc.setFontSize(18);
  doc.text("Wandfreigabe — AWO Psychiatriezentrum Halle, Haus 2", margin, 22);
  doc.setFontSize(11);
  doc.text("Umbau und Sanierung — Lph 8", margin, 30);
  doc.text(`Stand: ${new Date().toLocaleString("de-DE")}`, margin, 37);
  doc.setFontSize(10);
  doc.setTextColor(193, 68, 59); doc.text("■", margin, 47); doc.setTextColor(0);
  doc.text("Offen", margin + 5, 47);
  doc.setTextColor(224, 165, 38); doc.text("■", margin + 30, 47); doc.setTextColor(0);
  doc.text("Teilweise freigegeben", margin + 35, 47);
  doc.setTextColor(62, 155, 92); doc.text("■", margin + 90, 47); doc.setTextColor(0);
  doc.text("Komplett freigegeben", margin + 95, 47);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text("Firmen: " + COMPANIES.map((c) => c.name).join(" · "), margin, 55);
  doc.setTextColor(0);

  for (const floorId of ["eg", "og"]) {
    doc.addPage();
    const canvas = await renderFloorCanvas(floorId);
    const imgData = canvas.toDataURL("image/jpeg", 0.85);
    const availW = pageW - margin * 2;
    const availH = pageH - margin * 2 - 14;
    const ratio = Math.min(availW / canvas.width, availH / canvas.height);
    const w = canvas.width * ratio, h = canvas.height * ratio;
    doc.setFontSize(14);
    doc.text(FLOORS[floorId].label, margin, margin + 4);
    doc.addImage(imgData, "JPEG", margin, margin + 8, w, h);

    doc.addPage();
    doc.setFontSize(14);
    doc.text(`${FLOORS[floorId].label} — Status je Wand`, margin, margin + 4);
    doc.setFontSize(9);
    let y = margin + 14;
    const walls = WALL_GEOMETRY[floorId] || [];
    walls.forEach((wall) => {
      const entry = getWallStatusEntry(floorId, wall.id);
      const st = statusOf(entry);
      const label = entry.label || `Wand ${wall.id.replace("w", "")}`;
      const companyStr = COMPANIES.map((c) => `${c.key}: ${entry.companies[c.key].done ? "OK" : "–"}`).join("    ");
      if (y > pageH - margin) { doc.addPage(); y = margin + 10; }
      doc.text(`${label}`, margin, y);
      doc.text(`[${st.toUpperCase()}]`, margin + 90, y);
      doc.text(companyStr, margin + 120, y);
      y += 5.2;
    });
  }

  doc.addPage();
  doc.setFontSize(14);
  doc.text("Verlauf", margin, margin + 4);
  doc.setFontSize(8.5);
  let y = margin + 14;
  const allLogs = [...state.data.eg.log, ...state.data.og.log].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  if (allLogs.length === 0) {
    doc.text("Noch keine Einträge.", margin, y);
  } else {
    allLogs.forEach((l) => {
      if (y > pageH - margin) { doc.addPage(); y = margin + 10; }
      doc.text(`${fmtDate(l.ts)} — ${FLOORS[l.floor]?.label} — ${l.label}: ${l.company} ${l.action} durch ${l.by}`, margin, y);
      y += 4.6;
    });
  }

  doc.save(`Wandfreigabe_${new Date().toISOString().slice(0, 10)}.pdf`);
  showToast("PDF heruntergeladen.");
}

// ---------- Init ----------
async function init() {
  initViewportInteractions();
  document.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
  document.getElementById("exportBtn").addEventListener("click", exportProtocol);
  document.getElementById("exportPdfBtn").addEventListener("click", exportPdf);
  document.getElementById("manageCompaniesBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleCompanyPanel(); });
  document.addEventListener("click", (e) => {
    const panel = document.getElementById("companyPanel");
    if (panel.style.display === "block" && !panel.contains(e.target) && e.target.id !== "manageCompaniesBtn") {
      toggleCompanyPanel(false);
    }
  });
  window.addEventListener("resize", () => { if (state.currentTab !== "protokoll") fitToViewport(); });

  await loadCompanies();
  initRoleSelect();
  await Promise.all([loadFloor("eg"), loadFloor("og")]);
  subscribeRealtime();
  switchTab("eg");
}

init();
</script>
