<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wandfreigabe — AWO Psychiatriezentrum Halle · Haus 2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#10263B;
    --bg-panel:#0B1D30;
    --line:#BFE3F0;
    --line-dim:#3E5A70;
    --ink:#E9F3F7;
    --ink-dim:#8FAAB8;
    --offen:#C1443B;
    --teilweise:#D9A441;
    --frei:#4C9A6A;
    --accent:#5FB4D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line-dim);background:var(--bg-panel);flex-wrap:wrap;gap:8px;}
  .title{font-size:15px;font-weight:700;letter-spacing:.2px;}
  .subtitle{font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{background:transparent;border:1px solid var(--line-dim);color:var(--ink-dim);border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  .tab-btn.active{background:rgba(95,180,214,.15);color:var(--accent);border-color:var(--accent);}

  .rolebar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--bg-panel);border-bottom:1px solid var(--line-dim);flex-wrap:wrap;}
  .rolebar label{font-size:12px;color:var(--ink-dim);}
  select,input,button{font-family:'Inter',sans-serif;}
  select,input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--line-dim);border-radius:6px;padding:6px 10px;font-size:12px;}
  .ghost-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .ghost-btn.danger{border-color:rgba(193,68,59,.6);color:var(--offen);}
  .ghost-btn:disabled{opacity:.4;cursor:not-allowed;}
  .spacer{flex:1;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .conn-live{background:var(--frei);}
  .conn-off{background:var(--offen);}

  main{flex:1;display:flex;overflow:hidden;}
  .plan-area{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .plan-toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg-panel);border-bottom:1px solid var(--line-dim);}
  .zoom-controls{display:flex;gap:4px;margin-left:auto;}
  .zoom-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line-dim);background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px;}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--ink-dim);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:5px;display:inline-block;}

  .viewport{flex:1;position:relative;overflow:hidden;background:
      linear-gradient(var(--bg) 0 0),
      repeating-linear-gradient(0deg, transparent 0 19px, rgba(191,227,240,.06) 19px 20px),
      repeating-linear-gradient(90deg, transparent 0 19px, rgba(191,227,240,.06) 19px 20px);
    cursor:grab;
  }
  .viewport.add-mode{cursor:crosshair;}
  .viewport.dragging{cursor:grabbing;}
  .canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
  .canvas img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer;}
  .marker .dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--bg-panel);}
  .marker.offen .dot{background:var(--offen);color:#fff;}
  .marker.teilweise .dot{background:var(--teilweise);}
  .marker.frei .dot{background:var(--frei);}
  .marker.selected .dot{box-shadow:0 0 0 3px var(--accent);}

  .addpin{position:absolute;transform:translate(-50%,-110%);background:var(--bg-panel);border:1px solid var(--accent);border-radius:8px;padding:10px;width:220px;z-index:20;}
  .addpin input{width:100%;margin-bottom:8px;}
  .addpin .row{display:flex;gap:6px;justify-content:flex-end;}
  .addpin button{font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--line-dim);background:var(--bg);color:var(--ink);}
  .addpin button.primary{background:var(--accent);color:var(--bg-panel);border-color:var(--accent);font-weight:700;}

  aside{width:300px;border-left:1px solid var(--line-dim);background:var(--bg-panel);padding:18px;overflow-y:auto;flex-shrink:0;}
  .empty-panel{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:40px;text-align:center;}
  .empty-text{font-size:12px;color:var(--ink-dim);line-height:1.5;}
  .panel-header{font-size:14px;font-weight:700;}
  .panel-sub{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .trade-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line-dim);border-radius:8px;padding:8px 10px;margin-top:8px;}
  .trade-name{font-size:12.5px;font-weight:600;}
  .trade-meta{font-size:10.5px;color:var(--ink-dim);margin-top:1px;}
  .small-btn{border:none;border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;white-space:nowrap;}
  .small-btn.go{background:var(--frei);color:#0B1D30;font-weight:700;}
  .small-btn.undo{background:transparent;color:var(--ink-dim);border:1px solid var(--line-dim);}
  .small-btn:disabled{cursor:not-allowed;opacity:.45;}
  .hint{font-size:11px;color:var(--ink-dim);margin-top:16px;line-height:1.5;}
  .del-link{font-size:11px;color:var(--offen);margin-top:14px;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}
  .del-link:disabled{opacity:.35;cursor:not-allowed;text-decoration:none;}

  .protocol-area{flex:1;padding:20px;overflow-y:auto;}
  .log-row{display:flex;flex-direction:column;gap:2px;font-size:12.5px;padding:8px 10px;background:var(--bg-panel);border-bottom:1px solid rgba(62,90,112,.4);}
  .log-ts{color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0B1D30;padding:9px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:50;}

  ::selection{background:rgba(95,180,214,.35);}
  @media (max-width:760px){
    aside{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.4);}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">Wandfreigabe — AWO Psychiatriezentrum Halle, Haus 2</div>
      <div class="subtitle"><span id="connDot" class="status-dot conn-off"></span><span id="connText">verbinde…</span> · Umbau und Sanierung — Lph 5</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="eg">Erdgeschoss</button>
      <button class="tab-btn" data-tab="og">Obergeschoss</button>
      <button class="tab-btn" data-tab="protokoll">Protokoll</button>
    </div>
  </header>

  <div class="rolebar">
    <label>Firma:</label>
    <select id="roleSelect"></select>
    <input type="text" id="nameInput" placeholder="Name / Kürzel (optional)" style="width:170px" />
    <button class="ghost-btn" id="addModeBtn">+ Position setzen</button>
    <div class="spacer"></div>
    <button class="ghost-btn" id="exportBtn">Protokoll kopieren</button>
  </div>

  <main>
    <div class="plan-area" id="planArea">
      <div class="plan-toolbar">
        <div class="legend">
          <span><i style="background:var(--offen)"></i>Offen</span>
          <span><i style="background:var(--teilweise)"></i>Teilweise</span>
          <span><i style="background:var(--frei)"></i>Komplett freigegeben</span>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut">–</button>
          <button class="zoom-btn" id="zoomReset" style="width:auto;padding:0 8px;font-size:11px;">100%</button>
          <button class="zoom-btn" id="zoomIn">+</button>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
          <img id="planImg" draggable="false" />
        </div>
      </div>
    </div>

    <aside id="sidePanel">
      <div class="empty-panel">
        <div class="empty-text">Position im Plan anklicken, um Freigaben pro Firma zu setzen.<br/><br/>Mit „+ Position setzen" und Klick auf den Plan legst du eine neue Wand/Öffnung an.</div>
      </div>
    </aside>
  </main>

  <div id="protocolArea" class="protocol-area" style="display:none;"></div>
</div>

<div id="toastHost"></div>

<script>
// ---------- Konfiguration ----------
const SUPABASE_URL = "https://beszfzvxtfwdzimixdbo.supabase.co";
const SUPABASE_KEY = "sb_publishable_onY7q5GNCGOxkEuzEOySDA_XyIqR6Rw";
const TABLE = "wandfreigabe_status";

const COMPANIES = [
  { key: "LKO", name: "LKO ELECTRO GmbH" },
  { key: "RK",  name: "Riek & Keßler GmbH" },
  { key: "SGW", name: "SG Weber" },
];

const FLOORS = {
  eg: { label: "Erdgeschoss", img: "assets/plan-eg.jpg", w: 3200, h: 2263 },
  og: { label: "Obergeschoss", img: "plan-og.jpg", w: 3200, h: 2263 },
};

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- State ----------
let state = {
  currentFloor: "eg",
  currentTab: "eg",
  data: { eg: { markers: [], log: [] }, og: { markers: [], log: [] } },
  role: COMPANIES[0].key,
  name: "",
  selectedMarkerId: null,
  addMode: false,
  scale: 1, tx: 0, ty: 0,
  fitScale: 1,
};

function emptyFloorData() { return { markers: [], log: [] }; }

// ---------- Supabase sync ----------
async function loadFloor(floorId) {
  try {
    const { data, error } = await supa.from(TABLE).select("data").eq("id", floorId).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      state.data[floorId] = data.data;
    } else {
      state.data[floorId] = emptyFloorData();
      await saveFloor(floorId);
    }
  } catch (e) {
    console.error(e);
    setConn(false);
  }
}

async function saveFloor(floorId) {
  try {
    const { error } = await supa.from(TABLE).upsert({ id: floorId, data: state.data[floorId], updated_at: new Date().toISOString() });
    if (error) throw error;
  } catch (e) {
    console.error(e);
    showToast("Speichern fehlgeschlagen — Verbindung prüfen.");
  }
}

function setConn(ok) {
  document.getElementById("connDot").className = "status-dot " + (ok ? "conn-live" : "conn-off");
  document.getElementById("connText").textContent = ok ? "live verbunden" : "keine Verbindung";
}

function subscribeRealtime() {
  supa.channel("wandfreigabe-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, (payload) => {
      const row = payload.new;
      if (!row || !row.id) return;
      if (!FLOORS[row.id]) return;
      state.data[row.id] = row.data || emptyFloorData();
      if (state.currentTab === row.id) renderMarkers();
      if (state.currentTab === "protokoll") renderProtocol();
    })
    .subscribe((status) => {
      setConn(status === "SUBSCRIBED");
    });
}

// ---------- Helpers ----------
function statusOf(marker) {
  const total = COMPANIES.length;
  const done = COMPANIES.filter((c) => marker.companies[c.key]?.done).length;
  if (done === 0) return "offen";
  if (done === total) return "frei";
  return "teilweise";
}
function canToggle(companyKey) { return state.role === companyKey; }
function fmtDate(iso) { return new Date(iso).toLocaleString("de-DE"); }
function showToast(msg) {
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  host.innerHTML = "";
  host.appendChild(el);
  setTimeout(() => { el.remove(); }, 2400);
}

// ---------- Rendering: role select ----------
function initRoleSelect() {
  const sel = document.getElementById("roleSelect");
  sel.innerHTML = COMPANIES.map((c) => `<option value="${c.key}">${c.name}</option>`).join("");
  sel.value = state.role;
  sel.addEventListener("change", () => { state.role = sel.value; renderSidePanel(); });
  document.getElementById("nameInput").addEventListener("input", (e) => { state.name = e.target.value; });
}

// ---------- Plan image / viewport ----------
function initPlanImage() {
  const img = document.getElementById("planImg");
  const floor = FLOORS[state.currentFloor];
  img.src = floor.img;
  img.onload = () => { fitToViewport(); renderMarkers(); };
}

function fitToViewport() {
  const viewport = document.getElementById("viewport");
  const floor = FLOORS[state.currentFloor];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const scale = Math.min(vw / floor.w, vh / floor.h) * 0.96;
  state.fitScale = scale;
  state.scale = scale;
  state.tx = (vw - floor.w * scale) / 2;
  state.ty = 20;
  applyTransform();
  updateZoomLabel();
}

function applyTransform() {
  const canvas = document.getElementById("canvas");
  const img = document.getElementById("planImg");
  const floor = FLOORS[state.currentFloor];
  img.style.width = floor.w + "px";
  img.style.height = floor.h + "px";
  canvas.style.width = floor.w + "px";
  canvas.style.height = floor.h + "px";
  canvas.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
}

function updateZoomLabel() {
  document.getElementById("zoomReset").textContent = Math.round((state.scale / state.fitScale) * 100) + "%";
}

function clampScale(s) {
  return Math.max(state.fitScale * 0.5, Math.min(state.fitScale * 8, s));
}

function initViewportInteractions() {
  const viewport = document.getElementById("viewport");
  let dragging = false, dragStart = null, moved = false;

  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = clampScale(state.scale * factor);
    state.tx = mx - (mx - state.tx) * (newScale / state.scale);
    state.ty = my - (my - state.ty) * (newScale / state.scale);
    state.scale = newScale;
    applyTransform();
    updateZoomLabel();
  }, { passive: false });

  viewport.addEventListener("mousedown", (e) => {
    if (e.target.closest(".marker") || e.target.closest(".addpin")) return;
    dragging = true; moved = false;
    dragStart = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    viewport.classList.add("dragging");
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    state.tx = dragStart.tx + dx;
    state.ty = dragStart.ty + dy;
    applyTransform();
  });
  window.addEventListener("mouseup", (e) => {
    if (dragging && !moved) handleViewportClick(e);
    dragging = false;
    viewport.classList.remove("dragging");
  });

  document.getElementById("zoomIn").addEventListener("click", () => {
    const rect = viewport.getBoundingClientRect();
    const mx = rect.width / 2, my = rect.height / 2;
    const newScale = clampScale(state.scale * 1.3);
    state.tx = mx - (mx - state.tx) * (newScale / state.scale);
    state.ty = my - (my - state.ty) * (newScale / state.scale);
    state.scale = newScale; applyTransform(); updateZoomLabel();
  });
  document.getElementById("zoomOut").addEventListener("click", () => {
    const rect = viewport.getBoundingClientRect();
    const mx = rect.width / 2, my = rect.height / 2;
    const newScale = clampScale(state.scale / 1.3);
    state.tx = mx - (mx - state.tx) * (newScale / state.scale);
    state.ty = my - (my - state.ty) * (newScale / state.scale);
    state.scale = newScale; applyTransform(); updateZoomLabel();
  });
  document.getElementById("zoomReset").addEventListener("click", fitToViewport);
}

function handleViewportClick(e) {
  removeAddPin();
  if (!state.addMode) return;
  const canvas = document.getElementById("canvas");
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  openAddPin(x, y, e.clientX, e.clientY);
}

function removeAddPin() {
  const existing = document.querySelector(".addpin");
  if (existing) existing.remove();
}

function openAddPin(relX, relY, screenX, screenY) {
  const planArea = document.getElementById("planArea");
  const areaRect = planArea.getBoundingClientRect();
  const pin = document.createElement("div");
  pin.className = "addpin";
  pin.style.left = (screenX - areaRect.left) + "px";
  pin.style.top = (screenY - areaRect.top) + "px";
  pin.innerHTML = `
    <input type="text" id="addPinLabel" placeholder="z.B. Wand R 0032 / R 0031" autofocus />
    <div class="row">
      <button id="addPinCancel">Abbrechen</button>
      <button class="primary" id="addPinSave">Anlegen</button>
    </div>`;
  planArea.appendChild(pin);
  const labelInput = pin.querySelector("#addPinLabel");
  labelInput.focus();
  pin.querySelector("#addPinCancel").addEventListener("click", () => pin.remove());
  const save = () => {
    const label = labelInput.value.trim();
    if (!label) { labelInput.focus(); return; }
    addMarker(relX, relY, label);
    pin.remove();
  };
  pin.querySelector("#addPinSave").addEventListener("click", save);
  labelInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") save(); if (ev.key === "Escape") pin.remove(); });
}

function addMarker(x, y, label) {
  const floor = state.currentFloor;
  const companies = {};
  COMPANIES.forEach((c) => { companies[c.key] = { done: false, by: null, at: null }; });
  const marker = { id: "m" + Date.now() + Math.floor(Math.random() * 1000), x, y, label, companies };
  state.data[floor].markers.push(marker);
  saveFloor(floor);
  renderMarkers();
  state.addMode = false;
  document.getElementById("addModeBtn").classList.remove("active-mode");
  selectMarker(marker.id);
}

// ---------- Marker rendering ----------
function renderMarkers() {
  const canvas = document.getElementById("canvas");
  canvas.querySelectorAll(".marker").forEach((m) => m.remove());
  const floorData = state.data[state.currentFloor];
  floorData.markers.forEach((marker) => {
    const st = statusOf(marker);
    const el = document.createElement("div");
    el.className = "marker " + st + (state.selectedMarkerId === marker.id ? " selected" : "");
    el.style.left = (marker.x * FLOORS[state.currentFloor].w) + "px";
    el.style.top = (marker.y * FLOORS[state.currentFloor].h) + "px";
    const doneCount = COMPANIES.filter((c) => marker.companies[c.key]?.done).length;
    el.innerHTML = `<div class="dot">${doneCount}/${COMPANIES.length}</div>`;
    el.addEventListener("click", (e) => { e.stopPropagation(); selectMarker(marker.id); });
    canvas.appendChild(el);
  });
}

function selectMarker(id) {
  state.selectedMarkerId = id;
  renderMarkers();
  renderSidePanel();
}

// ---------- Side panel ----------
function renderSidePanel() {
  const panel = document.getElementById("sidePanel");
  const floorData = state.data[state.currentFloor];
  const marker = floorData.markers.find((m) => m.id === state.selectedMarkerId);
  if (!marker) {
    panel.innerHTML = `<div class="empty-panel"><div class="empty-text">Position im Plan anklicken, um Freigaben pro Firma zu setzen.<br/><br/>Mit „+ Position setzen" und Klick auf den Plan legst du eine neue Wand/Öffnung an.</div></div>`;
    return;
  }
  const st = statusOf(marker);
  const stColorVar = st === "offen" ? "var(--offen)" : st === "teilweise" ? "var(--teilweise)" : "var(--frei)";
  let rows = "";
  COMPANIES.forEach((c) => {
    const entry = marker.companies[c.key];
    const allowed = canToggle(c.key);
    rows += `
      <div class="trade-row" style="opacity:${allowed ? 1 : 0.55}">
        <div>
          <div class="trade-name">${c.name}</div>
          ${entry.done ? `<div class="trade-meta">${entry.by} · ${fmtDate(entry.at)}</div>` : `<div class="trade-meta">offen</div>`}
        </div>
        <button class="small-btn ${entry.done ? "undo" : "go"}" data-company="${c.key}" ${allowed ? "" : "disabled"}>
          ${entry.done ? "Zurückziehen" : "Freigeben"}
        </button>
      </div>`;
  });
  const canDelete = COMPANIES.every((c) => !marker.companies[c.key].done);
  panel.innerHTML = `
    <div class="panel-header">${marker.label}</div>
    <div class="panel-sub">Status: <strong style="color:${stColorVar}">${st.toUpperCase()}</strong> · ${FLOORS[state.currentFloor].label}</div>
    ${rows}
    <p class="hint">Als „${COMPANIES.find((c) => c.key === state.role)?.name}" kannst du nur die eigene Freigabe setzen.</p>
    <button class="del-link" id="delMarkerBtn" ${canDelete ? "" : "disabled"}>${canDelete ? "Position löschen" : "Löschen erst möglich, solange keine Firma freigegeben hat"}</button>
  `;
  panel.querySelectorAll("button[data-company]").forEach((btn) => {
    btn.addEventListener("click", () => toggleCompany(marker.id, btn.getAttribute("data-company")));
  });
  const delBtn = document.getElementById("delMarkerBtn");
  if (canDelete) delBtn.addEventListener("click", () => deleteMarker(marker.id));
}

function toggleCompany(markerId, companyKey) {
  if (!canToggle(companyKey)) return;
  const floor = state.currentFloor;
  const floorData = state.data[floor];
  const marker = floorData.markers.find((m) => m.id === markerId);
  if (!marker) return;
  const entry = marker.companies[companyKey];
  const ts = new Date().toISOString();
  const actor = state.name ? `${state.role} (${state.name})` : state.role;
  const companyName = COMPANIES.find((c) => c.key === companyKey).name;
  if (entry.done) {
    entry.done = false; entry.by = null; entry.at = null;
    floorData.log.unshift({ ts, markerId, label: marker.label, floor, company: companyName, action: "zurückgezogen", by: actor });
  } else {
    entry.done = true; entry.by = actor; entry.at = ts;
    floorData.log.unshift({ ts, markerId, label: marker.label, floor, company: companyName, action: "freigegeben", by: actor });
  }
  floorData.log = floorData.log.slice(0, 500);
  saveFloor(floor);
  renderMarkers();
  renderSidePanel();
}

function deleteMarker(markerId) {
  const floor = state.currentFloor;
  const floorData = state.data[floor];
  floorData.markers = floorData.markers.filter((m) => m.id !== markerId);
  state.selectedMarkerId = null;
  saveFloor(floor);
  renderMarkers();
  renderSidePanel();
}

// ---------- Protocol ----------
function renderProtocol() {
  const area = document.getElementById("protocolArea");
  const allLogs = [...state.data.eg.log, ...state.data.og.log].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  if (allLogs.length === 0) {
    area.innerHTML = `<div class="panel-header">Verlauf</div><p class="empty-text" style="margin-top:10px;">Noch keine Einträge — sobald eine Firma eine Position freigibt, erscheint das hier.</p>`;
    return;
  }
  const rows = allLogs.map((l) => `
    <div class="log-row">
      <span class="log-ts">${fmtDate(l.ts)} · ${FLOORS[l.floor]?.label || l.floor}</span>
      <span><strong>${l.label}</strong> — ${l.company}
        <span style="color:${l.action === "freigegeben" ? "var(--frei)" : "var(--offen)"}">${l.action}</span>
        durch ${l.by}</span>
    </div>`).join("");
  area.innerHTML = `<div class="panel-header">Verlauf</div><div style="margin-top:10px;">${rows}</div>`;
}

function exportProtocol() {
  const lines = ["PROTOKOLL — WANDFREIGABEN", "AWO Psychiatriezentrum Halle, Haus 2", new Date().toLocaleString("de-DE"), ""];
  Object.keys(FLOORS).forEach((floorId) => {
    lines.push(`=== ${FLOORS[floorId].label} ===`);
    state.data[floorId].markers.forEach((m) => {
      const st = statusOf(m);
      lines.push(`${m.label} [${st.toUpperCase()}]`);
      COMPANIES.forEach((c) => {
        const e = m.companies[c.key];
        lines.push(`  - ${c.name}: ${e.done ? `freigegeben (${e.by}, ${fmtDate(e.at)})` : "offen"}`);
      });
    });
    lines.push("");
  });
  lines.push("VERLAUF:");
  const allLogs = [...state.data.eg.log, ...state.data.og.log].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  allLogs.forEach((l) => lines.push(`${fmtDate(l.ts)} — ${FLOORS[l.floor]?.label} — ${l.label}: ${l.company} ${l.action} durch ${l.by}`));

  const text = lines.join("\n");
  navigator.clipboard.writeText(text).then(
    () => showToast("Protokoll in Zwischenablage kopiert."),
    () => showToast("Kopieren nicht möglich.")
  );
}

// ---------- Tabs ----------
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const planArea = document.getElementById("planArea");
  const sidePanel = document.getElementById("sidePanel");
  const protocolArea = document.getElementById("protocolArea");
  if (tab === "protokoll") {
    planArea.style.display = "none";
    sidePanel.style.display = "none";
    protocolArea.style.display = "block";
    renderProtocol();
  } else {
    planArea.style.display = "flex";
    sidePanel.style.display = "block";
    protocolArea.style.display = "none";
    state.currentFloor = tab;
    state.selectedMarkerId = null;
    initPlanImage();
    renderSidePanel();
  }
}

// ---------- Init ----------
async function init() {
  initRoleSelect();
  initViewportInteractions();

  document.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
  document.getElementById("addModeBtn").addEventListener("click", (e) => {
    state.addMode = !state.addMode;
    document.getElementById("viewport").classList.toggle("add-mode", state.addMode);
    e.target.textContent = state.addMode ? "Klicke auf den Plan …" : "+ Position setzen";
  });
  document.getElementById("exportBtn").addEventListener("click", exportProtocol);
  window.addEventListener("resize", () => { if (state.currentTab !== "protokoll") fitToViewport(); });

  await Promise.all([loadFloor("eg"), loadFloor("og")]);
  subscribeRealtime();
  switchTab("eg");
}

init();
</script>
</body>
</html>
